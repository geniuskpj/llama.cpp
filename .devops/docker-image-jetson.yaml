# This workflow uses actions that are not certified by GitHub.  
# They are provided by a third-party and are governed by  
# separate terms of service, privacy policy, and support  
# documentation.

# GitHub recommends pinning actions to a commit SHA.  
# To get a newer version, you will need to update the SHA.  
# You can also reference a tag or branch, but the action may change without warning.

name: Publish Jetson Docker image

on:  
  workflow_dispatch: # allows manual triggering

concurrency:  
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}  
  cancel-in-progress: true

# Fine-grant permission  
# https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication#modifying-the-permissions-for-the-github_token  
permissions:  
  packages: write

jobs:  
  push_to_registry:  
    name: Push Jetson Docker image to Docker Hub  
    runs-on: ${{ matrix.config.runs_on }}  
    env:  
      COMMIT_SHA: ${{ github.sha }}  
    strategy:  
      fail-fast: false  
      matrix:  
        config:  
          # Jetson L4T JetPack r36.4.0  
          - { tag: "jetson l4t-r36.4.0", dockerfile: ".devops/jetson.Dockerfile", platforms: "linux/arm64", full: false, light: false, server: true, free_disk_space: false, runs_on: "ubuntu-24.04" }

    steps:  
      - name: Check out the repo  
        uses: actions/checkout@v6  
        with:  
          fetch-depth: 0 # preserve git history, so we can determine the build number

      - name: Set up Docker Buildx  
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub  
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3  
        with:  
          registry: ghcr.io  
          username: ${{ github.repository_owner }}  
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine source tag name  
        id: srctag  
        uses: ./.github/actions/get-tag-name  
        env:  
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

      - name: Determine image tag name  
        id: tag  
        shell: bash  
        run: |  
          REPO_OWNER="${GITHUB_REPOSITORY_OWNER@L}"  # to lower case  
          REPO_NAME="${{ github.event.repository.name }}"  
          PREFIX="ghcr.io/${REPO_OWNER}/${REPO_NAME}:"  
          ARCH_SUFFIX="${{ matrix.config.platforms == 'linux/arm64' && '-arm64' || '' }}"  
          # list all tags possible  
          tags="${{ matrix.config.tag }}"  
          for tag in $tags; do  
              CACHETAGS="${PREFIX}buildcache-${tag}${ARCH_SUFFIX}"  
              FULLTAGS="${FULLTAGS:+$FULLTAGS,}${PREFIX}full-${tag}${ARCH_SUFFIX},${PREFIX}full-${tag}-${{ steps.srctag.outputs.name }}${ARCH_SUFFIX}"  
              LIGHTTAGS="${LIGHTTAGS:+$LIGHTTAGS,}${PREFIX}light-${tag}${ARCH_SUFFIX},${PREFIX}light-${tag}-${{ steps.srctag.outputs.name }}${ARCH_SUFFIX}"  
              SERVERTAGS="${SERVERTAGS:+$SERVERTAGS,}${PREFIX}server-${tag}${ARCH_SUFFIX},${PREFIX}server-${tag}-${{ steps.srctag.outputs.name }}${ARCH_SUFFIX}"  
          done  
          echo "cache_output_tags=$CACHETAGS" >> $GITHUB_OUTPUT  
          echo "full_output_tags=$FULLTAGS" >> $GITHUB_OUTPUT  
          echo "light_output_tags=$LIGHTTAGS" >> $GITHUB_OUTPUT  
          echo "server_output_tags=$SERVERTAGS" >> $GITHUB_OUTPUT  
          echo "cache_output_tags=$CACHETAGS"  # print out for debugging  
          echo "full_output_tags=$FULLTAGS"  # print out for debugging  
          echo "light_output_tags=$LIGHTTAGS"  # print out for debugging  
          echo "server_output_tags=$SERVERTAGS"  # print out for debugging  
        env:  
          GITHUB_REPOSITORY_OWNER: '${{ github.repository_owner }}'

      - name: Build and push Server Docker image (tagged + versioned)  
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && matrix.config.server == true }}  
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6  
        with:  
          context: .  
          push: true  
          platforms: ${{ matrix.config.platforms }}  
          tags: ${{ steps.tag.outputs.server_output_tags }}  
          file: ${{ matrix.config.dockerfile }}  
          target: server  
          provenance: false  
          cache-from: type=registry,ref=${{ steps.tag.outputs.cache_output_tags }}  
          cache-to: type=registry,ref=${{ steps.tag.outputs.cache_output_tags }},mode=max

  create_tag:  
    name: Create and push git tag  
    runs-on: ubuntu-22.04  
    permissions:  
      contents: write

    steps:  
      - name: Clone  
        id: checkout  
        uses: actions/checkout@v6  
        with:  
          fetch-depth: 0

      - name: Determine source tag name  
        id: srctag  
        uses: ./.github/actions/get-tag-name  
        env:  
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

      - name: Create and push git tag  
        env:  
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  
        run: |  
          git tag ${{ steps.srctag.outputs.name }} || exit 0  
          git push origin ${{ steps.srctag.outputs.name }} || exit 0
